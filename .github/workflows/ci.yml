name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false
      - run: go test -race ./...
        working-directory: agent
      - run: go vet ./...
        working-directory: agent
      - run: go build ./cmd/qiyun-agent
        working-directory: agent
